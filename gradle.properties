# ---------------------------------------------------------------------------
# Fabric 1.21.11 generator - build properties
# ---------------------------------------------------------------------------
# Plugin version published in plugin.json and packaged in the archive name.
pluginVersion=2026.3-1.0.12.1-beta

# Minecraft version this generator targets (must match the generator folder
# name suffix and the workspace minecraft dependency).
mcVersion=1.21.11

# MCreator build this generator was adapted against (EAP 2026344621).
# The numeric form used by MCreator is 202600344621 (see plugin.json).
mcreatorVersion=2026.3.44621

# Fabric toolchain pinned for Minecraft 1.21.11.
fabricLoaderVersion=0.20.1
fabricApiVersion=0.141.6

# Gradle distribution used by the generated workspace. 9.8.0 is the version
# bundled with MCreator 2026.3 and the version validated for this generator.
gradleVersion=9.8.0

# MCreator installation used when running MCreator-backed test tasks.
# Leave "unassigned" to build this project without a MCreator checkout.
mcreator_path=unassigned
