plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14-SNAPSHOT'
}

version = '1.0'
base.archivesName = "modid"

loom {
    // Minecraft 1.21.11 is the last obfuscated release, so mixin refmaps are
    // still required for production jars.
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "${modid}.refmap.json"
    }

    if (file("src/main/resources/META-INF/${modid}.classtweaker").exists())
        accessWidenerPath = file("src/main/resources/META-INF/${modid}.classtweaker")
}

/*
 * Migration guard for workspaces generated by generator 2026.3-1.0.0-beta.
 *
 * Those workspaces contain a class tweaker whose header declares the "official" namespace. Loom's
 * class-tweaker reader requires the "named" namespace for an obfuscated game (1.21.11), and fails
 * at configuration time with:
 *   Namespace mismatch, expected named got official
 *
 * The current template already emits "named". This block keeps older workspaces buildable even
 * when MCreator only runs a Gradle sync and does not regenerate the project base. It is
 * idempotent and can be removed once every workspace has been regenerated.
 */
fileTree("src/main/resources/META-INF") {
    include "*.classtweaker", "*.accesswidener"
}.files.each { tweaker ->
    def text = tweaker.getText("UTF-8")
    def migrated = null

    if (text.startsWith("classTweaker v1 official")) {
        migrated = text.replaceFirst("classTweaker v1 official", "classTweaker v1 named")
    } else if (text.startsWith("accessWidener v2 official")) {
        migrated = text.replaceFirst("accessWidener v2 official", "accessWidener v2 named")
    }

    if (migrated != null) {
        tweaker.setText(migrated, "UTF-8")
        // Do not use a Groovy GString here: MCreator preprocesses this file with FreeMarker and
        // would try to resolve dollar-brace expressions at workspace setup time.
        logger.lifecycle("Migrated " + tweaker.name + " namespace from 'official' to 'named' for Minecraft 1.21.11")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${generator.getGeneratorMinecraftVersion()}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:0.20.1"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${generator.getGeneratorBuildFileVersion()}+${generator.getGeneratorMinecraftVersion()}"
}

// The Configuration Files element is backed by Forge Config API Port on Fabric. Only add the
// dependency when the workspace actually generated a configuration class.
def hasConfigElement = fileTree("src/main/java") {
    include "**/configuration/*Configuration.java"
}.files.size() > 0

if (hasConfigElement) {
    repositories {
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
        }
    }

    dependencies {
        // Forge Config API Port 21.11.1 (ForgeConfigAPIPort-v21.11.1-mc1.21.11-Fabric.jar)
        modImplementation 'maven.modrinth:forge-config-api-port:uXrWPsCu'
        implementation 'com.electronwill.night-config:core:3.8.4'
        implementation 'com.electronwill.night-config:toml:3.8.4'
    }
}

// We need to do this because MCreator doesn't allow to split armor textures in multiple folders
tasks.named('processResources', ProcessResources) {
    doLast {
        copy {
            from(layout.buildDirectory.dir("resources/main/assets/${modid}/textures/entity/equipment/humanoid"))
            into(layout.buildDirectory.dir("resources/main/assets/${modid}/textures/entity/equipment/humanoid_leggings"))
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

apply from: 'mcreator.gradle'